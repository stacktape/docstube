name: docstube
description: Run docstube generate (the idempotent reconciler), open a verified-delta PR, and auto-merge when no flag blocks it.
inputs:
  github-token:
    description: GitHub token used by the gh CLI for the PR, flag comment, digest issue, and auto-merge.
    required: false
  base-branch:
    description: Branch to update from and target with the PR.
    required: false
  branch-prefix:
    description: Prefix for the generated docs branch.
    required: false
    default: docstube/docs
  commit-message:
    description: Commit message for the single atomic docs + manifest commit.
    required: false
  docstube-package:
    description: npm package spec used by npx to run docstube. Defaults to the exact version this action shipped with (kept in sync by the release workflow).
    required: false
    default: docstube@0.0.2
  workspace:
    description: Checked-out repository path.
    required: false
outputs:
  changed:
    description: Whether docstube left documentation changes to ship.
  branch-name:
    description: Branch name used for docstube changes.
  committed-paths:
    description: JSON array of paths committed atomically (docs, manifest shards, criteria, instructions).
  pull-request-url:
    description: URL of the opened or updated pull request.
  auto-merge:
    description: Auto-merge decision for the PR (enabled, blocked, unavailable, skipped).
  open-flag-count:
    description: Number of open flags delivered on the PR.
  concurrency-group:
    description: Suggested workflow concurrency group for this run.
runs:
  using: node24
  main: dist/github-action.mjs
