flags:
  - id: fl_7hqgp38qwcm45bwdp30z
    kind: tribal-knowledge
    status: resolved
    summary: "writer question: The command-help strings mention `docstube wizard [--fresh]` and `docstube refine [page] [--failed] [--max-rounds <n>]`,…"
    detail: The CLI reference page needs to document accepted flags without inventing behavior from stale help text.
    entity:
      version: latest
      locale: en
      pageId: pg_w1g31xs3zyr6t1mh97yb
    question: The command-help strings mention `docstube wizard [--fresh]` and `docstube refine [page] [--failed] [--max-rounds <n>]`, but `apps/cli/src/cli.ts` defines `wizard --port` and refine budget flags `--max-pages`, `--max-rounds-per-page`, and `--total-rounds`. Should the help strings be updated to match the parser, or is there intended behavior not visible in the command parser?
    answer:
      text: "The help strings were stale and have been fixed to match the parser. Document the parser as the source of truth: wizard takes --port <n>; generate and refresh take --max-attempts <n>; refine takes [page] [--failed] [--max-pages <n>] [--max-rounds-per-page <n>] [--total-rounds <n>]; audit takes <docs-dir> [--json]. There is no --fresh or --max-rounds flag."
      answeredAt: 2026-07-16T20:31:39.147Z
      author: cli
    runId: run_zdc1xg4347zhh2wyh3jg
    createdAt: 2026-07-16T20:15:57.810Z
